# Pipeline CI Maestro — Phase 0 (voir docs/10-workflow-git.md §8).
#
# Deux étages :
#   - lint : shellcheck (scripts shell) + ruff (code Python) ;
#   - test : pytest (suite du dépôt, avec couverture pytest-cov) + mypy (typage
#     strict du code applicatif).
# « Pipeline vert » est une condition de merge. Les jobs Python installent leurs
# dépendances depuis pyproject.toml (extra `dev`) — rien n'est figé en dur ici.
#
# Exécution : ces jobs tournent sur les **runners de projet** (exécuteur Docker) — le
# runner PARTAGÉ hébergé sur une machine toujours allumée, et le runner LOCAL de chaque
# poste en secours. Les runners partagés GitLab, eux, sont désactivés au niveau projet
# (shared_runners_enabled=false, cf. scripts/gitlab/bootstrap.sh) car leur quota est
# épuisé ; aucun `tags:` n'est donc nécessaire (les runners de projet acceptent les jobs
# non-taggés, n'importe lequel prend n'importe quel job). Au moins un doit être en ligne,
# sinon les jobs restent `pending`. Détail : docs/10-workflow-git.md §8.

# Quand un pipeline se déclenche : UNIQUEMENT sur les Merge Requests (ticket #165). Sans ces
# règles, GitLab crée un pipeline de branche à CHAQUE push : la CI tournait donc pendant le
# développement, encore à la clôture du ticket, puis une troisième fois sur `main` après le merge
# — trois passages sur le runner unique de l'équipe (§8.1) pour un seul verdict utile, celui qui
# conditionne le merge de la MR. Ce qu'on garde :
#   - merge_request_event : création d'une MR, puis chaque push sur sa branche source tant qu'elle
#     est ouverte. C'est ce pipeline que regarde `only_allow_merge_if_pipeline_succeeds`, donc le
#     garde-fou « pipeline vert avant merge » est intact ;
#   - web / api : déclenchement MANUEL et explicite (bouton « Run pipeline », `glab ci run -b …`
#     — le repli de /pipeline-fix quand un push n'a pas produit de pipeline). Jamais automatique.
# Tout le reste — push sur une branche sans MR, push sur `main` après merge, tags — ne déclenche
# plus rien. Vérifier son travail AVANT d'ouvrir la MR se fait en local avec `scripts/ci/local.sh`,
# qui rejoue ces mêmes jobs sur le poste. Détail : docs/10-workflow-git.md §8.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - when: never

stages:
  - lint
  - test

# Cache pip partagé par les jobs Python (lint + test, ticket #38) : les wheels
# téléchargés sont conservés dans le dépôt (.cache/pip, déjà gitignoré) et réutilisés
# entre pipelines tant que pyproject.toml ne change pas — sur un run avec cache chaud,
# le before_script se réduit à une installation depuis le cache local.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

.pip-cache:
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .cache/pip

shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck --version
    - |
      files=$(find scripts -type f -name '*.sh' | sort)
      if [ -z "$files" ]; then
        echo "Aucun script *.sh à analyser."
        exit 0
      fi
      echo "Scripts analysés :"
      printf '  %s\n' $files
      # Sévérité 'warning' : bloque sur les vrais problèmes (variables non définies, tests
      # douteux, redirections cassées…) sans pinailler sur le style (SC2086/SC1091 = niveau
      # 'info', tolérés). À durcir en '--severity=style' quand les scripts seront stabilisés.
      shellcheck --severity=warning $files

# Lint du code Python (maestro/, tests/). La config des règles vit dans pyproject.toml
# ([tool.ruff]). N'installe que ruff : pas besoin du SDK ni d'une clé API pour le lint.
python-lint:
  stage: lint
  image: python:3.11-slim
  extends: .pip-cache
  script:
    - pip install "ruff>=0.6,<1.0"
    - ruff check .

# Base cachée des jobs Python de test : installe le paquet en editable avec son extra
# `dev` (pytest, mypy, stubs de types) — versions déclarées dans pyproject.toml, donc
# reproductible et sans duplication ici. Les tests n'appellent aucun modèle (provider
# factice), mais importer le paquet tire le SDK : on installe donc bien les deps runtime.
.python-test:
  stage: test
  image: python:3.11-slim
  extends: .pip-cache
  before_script:
    - pip install -e ".[dev]"

# Exécute la suite de tests du dépôt (testpaths = tests/ dans pyproject.toml) avec la
# couverture du code applicatif (pytest-cov, ticket #38) ; le job échoue si un test
# échoue ou si la couverture passe sous le seuil. La métrique exclut les points
# d'entrée CLI/démo ([tool.coverage.run] omit, ticket #89 — smoke tests en
# contrepartie) et reflète le code métier : 94 % mesurés à la pose du seuil, marge
# de 4 points pour absorber les variations sans laisser la couverture s'éroder.
# La clé `coverage:` remonte le taux dans GitLab (badge, affichage MR).
#
# `-n auto` (pytest-xdist, ticket #214) : la suite se répartit sur autant de processus que le
# runner a de cœurs. Les ~360 tests d'outillage montent chacun un dépôt git jetable et attendent
# un script shell — ils sont bornés par des processus, pas par le CPU, et se parallélisent donc
# presque idéalement (mesuré : 9 min 57 s en série contre 2 min 34 s, même verdict). C'est ici
# que ça compte le plus : depuis #165 ce pipeline est le SEUL verdict complet, celui qui
# conditionne le merge — et depuis #214 le filet local ne joue plus par défaut que le périmètre
# du diff. pytest-cov agrège nativement la couverture des workers : le seuil est inchangé.
pytest:
  extends: .python-test
  script:
    - pytest -n auto --cov=maestro --cov-fail-under=90
  coverage: '/TOTAL.*? (100(?:\.\d+)?\%|[1-9]?\d(?:\.\d+)?\%)/'

# Vérifie le typage statique du code applicatif (maestro/) en mode strict
# ([tool.mypy] de pyproject.toml) ; le job échoue à la moindre erreur de type. On cible
# maestro/ et non tests/ : les helpers de test ne sont pas annotés (le strict les
# rejetterait) et ne sont pas du code applicatif.
mypy:
  extends: .python-test
  script:
    - mypy maestro

# Lint, tests et build de l'UI Control Tower (apps/web, tickets #47 et #124) :
# ESLint, puis la suite Vitest, puis `next build` — qui vérifie aussi le typage
# TypeScript. Ne tourne que si le front (ou ce fichier) change — un pipeline
# purement Python reste rapide.
#
# Les trois dans UN job plutôt que trois : l'installation (`npm ci`) pèse bien
# plus que les contrôles eux-mêmes, et la refaire deux fois de plus occuperait
# le runner de l'équipe (§8.1) sans rien apprendre. L'ordre va du plus rapide au
# plus lent, pour que le verdict tombe tôt quand il est rouge.
#
# `npm ci` s'appuie sur le lockfile versionné ; le cache npm est réutilisé
# entre pipelines tant que le lockfile ne bouge pas.
web-build:
  stage: test
  image: node:22-alpine
  rules:
    - changes:
        paths:
          - apps/web/**/*
          - .gitlab-ci.yml
  cache:
    key:
      files:
        - apps/web/package-lock.json
    paths:
      - apps/web/.npm/
  script:
    - cd apps/web
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm test
    - npm run build
