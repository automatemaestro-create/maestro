# Pipeline CI Maestro — Phase 0 (voir docs/10-workflow-git.md §8).
#
# Deux étages :
#   - lint : shellcheck (scripts shell) + ruff (code Python) ;
#   - test : pytest (suite du dépôt, avec couverture pytest-cov) + mypy (typage
#     strict du code applicatif).
# « Pipeline vert » est une condition de merge. Les jobs Python installent leurs
# dépendances depuis pyproject.toml (extra `dev`) — rien n'est figé en dur ici.

stages:
  - lint
  - test

# Cache pip partagé par les jobs Python (lint + test, ticket #38) : les wheels
# téléchargés sont conservés dans le dépôt (.cache/pip, déjà gitignoré) et réutilisés
# entre pipelines tant que pyproject.toml ne change pas — sur un run avec cache chaud,
# le before_script se réduit à une installation depuis le cache local.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

.pip-cache:
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .cache/pip

shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck --version
    - |
      files=$(find scripts -type f -name '*.sh' | sort)
      if [ -z "$files" ]; then
        echo "Aucun script *.sh à analyser."
        exit 0
      fi
      echo "Scripts analysés :"
      printf '  %s\n' $files
      # Sévérité 'warning' : bloque sur les vrais problèmes (variables non définies, tests
      # douteux, redirections cassées…) sans pinailler sur le style (SC2086/SC1091 = niveau
      # 'info', tolérés). À durcir en '--severity=style' quand les scripts seront stabilisés.
      shellcheck --severity=warning $files

# Lint du code Python (maestro/, tests/). La config des règles vit dans pyproject.toml
# ([tool.ruff]). N'installe que ruff : pas besoin du SDK ni d'une clé API pour le lint.
python-lint:
  stage: lint
  image: python:3.11-slim
  extends: .pip-cache
  script:
    - pip install "ruff>=0.6,<1.0"
    - ruff check .

# Base cachée des jobs Python de test : installe le paquet en editable avec son extra
# `dev` (pytest, mypy, stubs de types) — versions déclarées dans pyproject.toml, donc
# reproductible et sans duplication ici. Les tests n'appellent aucun modèle (provider
# factice), mais importer le paquet tire le SDK : on installe donc bien les deps runtime.
.python-test:
  stage: test
  image: python:3.11-slim
  extends: .pip-cache
  before_script:
    - pip install -e ".[dev]"

# Exécute la suite de tests du dépôt (testpaths = tests/ dans pyproject.toml) avec la
# couverture du code applicatif (pytest-cov, ticket #38) ; le job échoue si un test
# échoue ou si la couverture passe sous le seuil. La métrique exclut les points
# d'entrée CLI/démo ([tool.coverage.run] omit, ticket #89 — smoke tests en
# contrepartie) et reflète le code métier : 94 % mesurés à la pose du seuil, marge
# de 4 points pour absorber les variations sans laisser la couverture s'éroder.
# La clé `coverage:` remonte le taux dans GitLab (badge, affichage MR).
pytest:
  extends: .python-test
  script:
    - pytest --cov=maestro --cov-fail-under=90
  coverage: '/TOTAL.*? (100(?:\.\d+)?\%|[1-9]?\d(?:\.\d+)?\%)/'

# Vérifie le typage statique du code applicatif (maestro/) en mode strict
# ([tool.mypy] de pyproject.toml) ; le job échoue à la moindre erreur de type. On cible
# maestro/ et non tests/ : les helpers de test ne sont pas annotés (le strict les
# rejetterait) et ne sont pas du code applicatif.
mypy:
  extends: .python-test
  script:
    - mypy maestro

# Lint + build de l'UI Control Tower (apps/web, ticket #47) : ESLint puis
# `next build`, qui vérifie aussi le typage TypeScript. Ne tourne que si le
# front (ou ce fichier) change — un pipeline purement Python reste rapide.
# `npm ci` s'appuie sur le lockfile versionné ; le cache npm est réutilisé
# entre pipelines tant que le lockfile ne bouge pas.
web-build:
  stage: test
  image: node:22-alpine
  rules:
    - changes:
        paths:
          - apps/web/**/*
          - .gitlab-ci.yml
  cache:
    key:
      files:
        - apps/web/package-lock.json
    paths:
      - apps/web/.npm/
  script:
    - cd apps/web
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run build
