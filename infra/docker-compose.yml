# Environnement de développement local — Maestro (POC Phase 0)
# Bases locales optionnelles : PostgreSQL (données/traces) + Redis (file de tâches, pub/sub).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: maestro
      POSTGRES_PASSWORD: maestro
      POSTGRES_DB: maestro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
