  "On retrouve un adhérent en cherchant son nom.",
  "La liste des adhérents montre qui est à jour de sa cotisation pour la saison en cours, qui court du 1er septembre au 31 août.",
  "Les trois tarifs existent : 35 € pour un adulte, 20 € pour les moins de 25 ans, 60 € pour une famille.",
  "Un paiement s'enregistre avec sa date, son montant et son moyen : chèque, espèces ou virement.",
  "La liste des adhérents qui n'ont pas payé la saison en cours est disponible, pour les relancer.",
  "L'application signale les certificats médicaux périmés (plus de trois ans) et ceux qui le seront dans le mois.",
  "Une sortie porte sa date, son lieu de rendez-vous, sa distance, son dénivelé, son niveau (facile, moyen ou difficile), son animateur et son nombre de places.",
