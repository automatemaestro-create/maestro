  "Seuls les adhérents à jour de cotisation peuvent s'inscrire, et une sortie difficile exige un certificat médical valide.",
  "Pour une sortie, un adhérent offre des places dans sa voiture ou en demande une, et l'on voit qui part avec qui.",
  "Les recettes et les dépenses s'enregistrent avec une catégorie ; le solde se lit, ainsi que, pour la saison, le total des recettes et des dépenses par catégorie.",
  "Le bureau publie des annonces, que tout adhérent connecté voit en arrivant.",
  "Chacun se connecte avec son e-mail et un mot de passe.",
  "Les membres du bureau ont accès à tout ; un adhérent voit et corrige sa propre fiche, mais ne voit ni les fiches des autres ni les comptes.",
  "La liste des adhérents et le bilan de la saison se sortent dans un fichier qui s'ouvre dans un tableur.",
