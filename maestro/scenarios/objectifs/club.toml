# Ce que la personne répond quand on lui demande quelque chose : sa feuille, écrite
# d'avance, sans aide technique. Elle ne la donne qu'à qui pose une question.
reponses = [
  "Je ne sais pas programmer : pour tout ce qui est technique, choisissez ce qui vous paraît le plus simple et le plus solide, je vous fais confiance.",
  "L'application tournera d'abord sur l'ordinateur du club, un portable sous Windows. Plus tard, on aimerait peut-être la mettre en ligne.",
  "Le tarif famille couvre deux adultes et leurs enfants qui vivent sous le même toit.",
  "Le certificat compte à partir de la date où le médecin l'a signé.",
