# La personne n'a pas demandé de dépôt Git : le banc ne l'impose pas. Un livrable non
# versionné se rejoue comme son dossier, moins ce qu'il déclare ignorer (`grille`).
versionner = false

# Les lignes jouées de la grille, celles qui ne dépendent d'aucun choix d'outillage.
axes = ["installation", "lint", "formatage", "types", "tests", "build", "pages"]

# Un « jour » du banc est une tranche de travail actif, pas vingt-quatre heures : la
# nuit ne coûte rien à mesurer, ce qu'elle éprouve est l'interruption puis la reprise.
# Trente minutes : la session seule a mis 26 min sur p5, trois à quatre fois plus petit,
# et Maestro passe une vingtaine de minutes dans le fil avant son run (docs/50 § 1.3).
jour_s = 1800

# Ce que le banc laisse à un passage, nuit comprise : six heures. C2 a mis 64 min sur p5.
delai_s = 21600

# Trois fois et demie p5 de chaque côté (docs/50 § 1.3) : une estimation annoncée avant
# de jouer, jamais une borne.
[cout_estime_usd]
maestro = 56.0
seul = 28.0
