[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro"
version = "0.0.0"
description = "Plateforme d'orchestration d'agents IA autonomes (Phase 0 — POC)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Moteur d'agents (cf. docs/02-stack-technique.md §2). Import : `claude_agent_sdk`.
    "claude-agent-sdk>=0.1.0",
    # Chargement du .env local (non versionné).
    "python-dotenv>=1.0.0",
    # Validation du schéma de tâche de l'orchestrateur (packages/shared, draft 2020-12).
    "jsonschema>=4.0",
    # File de tâches et workers parallèles (ticket #41) — broker/backend Redis
    # (cf. docs/02-stack-technique.md : Celery + Redis pour démarrer).
    "celery[redis]>=5.3",
    # Backend Control Tower (ticket #46) : API REST + WebSocket temps réel
    # (cf. docs/02-stack-technique.md §4 : FastAPI + Redis Pub/Sub).
    "fastapi>=0.110",
    # Serveur ASGI de l'API (`maestro-api`) ; [standard] apporte le support WebSocket.
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    # Stubs de types pour jsonschema (mypy strict).
    "types-jsonschema>=4.0",
    # Client des tests d'API (TestClient de Starlette, REST + WebSocket, ticket #46).
    # Starlette a déprécié httpx au profit de httpx2 pour son TestClient.
    "httpx2>=2.0",
]

[project.scripts]
# Vérifie que l'environnement est prêt (SDK importable + clé API lue).
maestro-check-env = "maestro.check_env:main"
# Démo : découpe un objectif en tâches JSON (orchestrateur, ticket #3).
maestro-orchestrate = "maestro.orchestrator.cli:main"
# Démo : déroule la boucle d'orchestration complète (assignation + exécution +
# agrégation) et imprime la synthèse (moteur, ticket #6).
maestro-run = "maestro.engine.cli:main"
# Démo de bout en bout du POC : boucle complète + artefacts dans des fichiers +
# vérification du critère de sortie Phase 0 (ticket #10).
maestro-demo = "maestro.demo:main"
# Démo : exécute une tâche de dev de bout en bout dans un espace isolé et imprime le
# livrable produit (agent Développeur, ticket #4 ; CLI factorisé par #35).
maestro-dev = "maestro.agents.runtime_cli:main_dev"
# Démo : exécute une tâche BDD de bout en bout dans un espace isolé et imprime le
# livrable produit (schéma, migrations, requêtes) (agent Base de données, ticket #5 ;
# CLI factorisé par #35).
maestro-bdd = "maestro.agents.runtime_cli:main_bdd"
# Démo : exécute une tâche de qualité de bout en bout dans un espace isolé et imprime
# le livrable produit (tests, rapport de revue, verdict) (agent QA, ticket #45).
maestro-qa = "maestro.agents.runtime_cli:main_qa"
# Backend Control Tower : sert l'API REST + WebSocket (bus Redis, ticket #46).
maestro-api = "maestro.controltower.cli:main"

[tool.setuptools.packages.find]
# Inclut `maestro` et ses sous-paquets (ex. `maestro.providers`).
include = ["maestro*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

# Le Claude Agent SDK n'expose pas (encore) de stubs typés : on tolère l'import.
[[tool.mypy.overrides]]
module = ["claude_agent_sdk.*"]
ignore_missing_imports = true

# Celery/kombu n'expose pas de stubs typés : on tolère l'import (mypy strict).
[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

# `@shared_task` (celery, non typé) rendrait la tâche « untyped » aux yeux du
# mode strict : dérogation limitée au module worker.
[[tool.mypy.overrides]]
module = ["maestro.queue.worker"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
