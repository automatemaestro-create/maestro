[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro"
version = "0.0.0"
description = "Plateforme d'orchestration d'agents IA autonomes (Phase 0 — POC)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Moteur d'agents (cf. docs/02-stack-technique.md §2). Import : `claude_agent_sdk`.
    "claude-agent-sdk>=0.1.0",
    # Chargement du .env local (non versionné).
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
]

[project.scripts]
# Vérifie que l'environnement est prêt (SDK importable + clé API lue).
maestro-check-env = "maestro.check_env:main"

[tool.setuptools.packages.find]
# Inclut `maestro` et ses sous-paquets (ex. `maestro.providers`).
include = ["maestro*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

# Le Claude Agent SDK n'expose pas (encore) de stubs typés : on tolère l'import.
[[tool.mypy.overrides]]
module = ["claude_agent_sdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
