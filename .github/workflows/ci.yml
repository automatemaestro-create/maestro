# Pipeline CI Maestro sur GitHub Actions (tickets #332 puis #338, chantier de migration #335).
#
# Ce workflow a commencé sa vie en MIROIR SANS AUTORITÉ (#332) : rejouer les jobs de la CI GitLab
# sur un dépôt GitHub alimenté par un miroir push, pour MESURER ce que #331 ne pouvait qu'estimer.
# La mesure est faite, la migration est décidée (#335), #338 lui a donné son déclencheur définitif
# — celui d'une CI qui conditionne un merge — et #344 a retiré la CI GitLab avec les 1 146 lignes
# d'outillage runner qu'elle exigeait.
#
# IL EST DÉSORMAIS LE SEUL VERDICT du dépôt. Les comparaisons à GitLab qui subsistent dans les
# commentaires sont de l'HISTOIRE : elles disent pourquoi un choix a été fait, jamais qu'il existe
# un second pipeline à tenir d'accord.
#
# Les six jobs : shellcheck, python-lint, pytest, mypy, web-build — plus `perimetre`, le
# job-portier qui n'avait pas d'équivalent GitLab (voir plus bas).

name: CI

# ─────────────────────────────────────────────────────────────────────────────
# DÉCLENCHEMENT — `pull_request`, l'équivalent du `merge_request_event` de GitLab (#338)
#
# Le `on: push` d'origine n'était pas un choix mais une contrainte du miroir : un miroir push ne
# réplique que des branches et des tags, il ne crée aucune pull request, donc `pull_request` ne se
# serait littéralement jamais déclenché. Cette contrainte tombe le jour où la CI fait autorité : ce
# qu'on veut vérifier est ce qu'on s'apprête à merger.
#
# `pull_request` est l'équivalent exact du `merge_request_event` de la CI GitLab (#165, docs/10
# §8) : le pipeline ne part ni au push d'une branche sans PR, ni sur `main` après le merge. C'est
# aussi ce qui RÉDUIT la consommation du dépôt — le miroir déclenchait un run à chaque push de
# branche, pour un verdict que personne ne lisait (docs/27 §10).
#
# Aucun filtre `branches:` : une PR est par définition un candidat au merge, quelle que soit sa
# cible. Les `types:` par défaut (`opened`, `synchronize`, `reopened`) couvrent le cycle de vie
# d'une PR Maestro, y compris ouverte en Draft — une PR en brouillon déclenche bien le workflow,
# et c'est voulu : /ticket-finish ouvre toujours en Draft (docs/10 §6).
#
# `workflow_dispatch` est conservé : c'est le seul moyen de rejouer la CI hors PR (diagnostic,
# vérification d'un runner, réglage d'un cache).
on:
  pull_request:
  workflow_dispatch:

# Annule le run précédent d'une même PR quand un nouveau push arrive. Sans équivalent dans
# la CI GitLab (qui a `interruptible`, non activé) : c'est un ajout délibéré — un run sur un
# état périmé n'apprend rien et se facture comme les autres.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
# VERSIONS DES ACTIONS — les majeures qui déclarent `node24` (#368)
#
# Les trois actions utilisées ici sont épinglées à leur DERNIÈRE majeure, et pas à la plus ancienne
# qui suffirait. Ce n'est pas de la mise à jour de confort : une action déclare dans son
# `action.yml` le runtime qu'elle exige (`runs.using`), et Node 20 est en fin de vie côté runners.
#
# Calendrier annoncé par GitHub (changelog du 2025-09-19) : le 16 juin 2026 les runners sont passés
# à Node 24 par défaut — une action `node20` continue de tourner, mais chaque run porte une
# annotation « Node.js 20 is deprecated […] being forced to run on Node.js 24 » —, puis Node 20 est
# RETIRÉ à l'automne 2026. À cette date une action `node20` ne démarre plus, et l'échappatoire
# `ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION=true` disparaît avec elle. Le coût de l'attendre n'est
# pas linéaire : ce sont toutes les PR d'un coup, sur la CI qui conditionne le merge depuis #338.
#
#   actions/checkout      v4 → v7   (node24 depuis v5)
#   actions/setup-python  v5 → v7   (node24 depuis v6)
#   actions/setup-node    v4 → v7   (node24 depuis v5)
#
# ALLER À LA DERNIÈRE MAJEURE plutôt qu'au saut minimal (v5/v6/v5) est le choix du ticket : les
# ruptures des majeures intermédiaires ont été relues une par une, aucune ne touche l'usage qu'on
# en a ici, et s'arrêter au minimum reviendrait à refaire ce ticket au prochain changelog.
#
#   · checkout v6 range les credentials dans un fichier séparé — sans effet, aucun job ne réutilise
#     le token git après le checkout (le `git diff` de `perimetre` est purement local) ;
#   · checkout v7 bloque le checkout d'une PR de fork sur `pull_request_target`/`workflow_run` —
#     ce workflow ne déclenche que sur `pull_request` et `workflow_dispatch`, et le dépôt est privé
#     (donc pas de fork). Une PR de fork changerait cette conclusion, pas la version ;
#   · setup-node v5 met en cache automatiquement dès que `package.json` porte un champ
#     `packageManager` — absent de `apps/web/package.json`, et le cache est de toute façon demandé
#     explicitement ci-dessous (`cache: npm`) ; v6 restreint ce cache automatique à npm ;
#   · setup-python v7 retire l'entrée `pip-install`, que ce workflow n'utilise pas.
#
# Ces majeures exigent un runner ≥ v2.327.1 : sans objet tant que les six jobs tournent sur
# `ubuntu-latest` (runner hébergé, tenu à jour par GitHub). Un runner auto-hébergé — la piste
# qu'a écartée #331 — remettrait cette contrainte sur la table.

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # PÉRIMÈTRE — l'équivalent du `rules: changes:` de web-build (critère 3 de #332)
  #
  # GitLab attache un filtre de chemins à UN job (`web-build` ne tourne que si `apps/web/**` ou le
  # fichier CI change). GitHub n'offre `paths:` qu'au niveau du WORKFLOW ENTIER : l'y mettre
  # sauterait aussi les jobs Python, c'est-à-dire l'inverse de l'effet voulu.
  #
  # D'où ce job-portier, qui calcule le périmètre et l'expose en sortie. Le job `web-build` porte
  # alors un `if:` — et un job sauté par `if:` est bien RAPPORTÉ (conclusion « skipped »), ce qui
  # satisfait une branch protection. C'est le piège classique de GitHub qu'on évite ici : un check
  # requis dont le WORKFLOW ne se déclenche pas n'est jamais rapporté du tout, et la PR reste
  # bloquée pour toujours, sans rien à cliquer pour la débloquer.
  #
  # ⚠ La branch protection est POSÉE depuis le 2026-08-28 (#734, docs/10 §8.8) : les six jobs de ce
  # fichier sont des CHECKS REQUIS sur `main`. Elle a été écartée de #338 au 2026-08-27, faute
  # d'exister sur un dépôt privé d'un compte Free — la structure était écrite pour elle avant de
  # l'être, et c'est ce qui a permis de la poser en une commande sans rien casser. Le piège
  # ci-dessus n'est donc plus théorique : ne jamais remplacer ce portier par un `paths:` de
  # workflow, et ne jamais ajouter de `paths:`/`paths-ignore:` au bloc `on:` — ce serait aujourd'hui
  # une PR indéfiniment non mergeable, découverte sous la pression plutôt qu'ici. Même règle pour
  # le RENOMMAGE d'un job : la liste `CHECKS` de `scripts/github/protect-main.sh` le nomme.
  #
  # Le calcul se fait en git nu, sans action tierce : une dépendance de plus dans la chaîne
  # d'approvisionnement se justifie mal pour trois lignes de `git diff`.
  perimetre:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filtre.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # nécessaire pour diffé contre la base de la PR

      - id: filtre
        shell: bash
        env:
          # La base vient de l'ÉVÉNEMENT, pas d'un nom de branche : sur `pull_request`, le dépôt est
          # checkouté sur le merge commit (`refs/pull/N/merge`) et `github.ref_name` vaut « N/merge »
          # — comparer à « main » par son nom ne matcherait donc jamais rien. `base.sha` est le sha
          # exact sur lequel GitHub a calculé ce merge, donc la seule base juste.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            # Hors PR (workflow_dispatch) : aucune base de comparaison n'a de sens. On ne saute
            # rien — le coût d'un web-build de trop est négligeable devant celui d'un verdict
            # manquant sur un déclenchement manuel, qui sert précisément à vérifier quelque chose.
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "hors pull request → web-build joué systématiquement."
            exit 0
          fi
          if ! git rev-parse --verify --quiet "${BASE_SHA}^{commit}" >/dev/null; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "base $BASE_SHA introuvable → web-build joué par précaution."
            exit 0
          fi
          # Deux points et non trois : HEAD est déjà le merge de la PR dans $BASE_SHA, donc
          # `$BASE_SHA HEAD` rend exactement le changement net de la PR. Un `...` recalculerait un
          # merge-base pour retomber au même endroit, au risque près qu'il n'y retombe pas.
          fichiers="$(git diff --name-only "$BASE_SHA" HEAD)"
          echo "Fichiers modifiés depuis $BASE_SHA :"
          printf '  %s\n' $fichiers
          if printf '%s\n' "$fichiers" | grep -qE '^(apps/web/|\.github/workflows/)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # UN APPEL PAR FICHIER, comme le filet local (#285) : shellcheck est superlinéaire en taille
  # totale reçue d'un coup, et il ne suit un `# shellcheck source=` que si le fichier sourcé est
  # lui aussi sur la ligne de commande — découper d'un seul côté ferait du filet un contrôle plus
  # strict que la CI qu'il prédit.
  #
  # Le shellcheck utilisé est celui PRÉINSTALLÉ sur le runner, et non une image en `container:` :
  # une action JavaScript comme `actions/checkout` exige un Node dans le conteneur, que l'image
  # alpine de shellcheck n'a pas — le job échouerait au checkout, avant d'avoir analysé une seule
  # ligne. C'est aussi pourquoi le filet local ne lit plus l'image dans ce fichier (#344) : il n'y
  # en a plus à y lire, et son `koalaman/shellcheck-alpine:stable` n'est qu'un repli de poste.
  # La version est imprimée : une dérive de verdict se lit dans les logs plutôt que de se
  # découvrir sur une PR bloquée.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - shell: bash
        run: |
          shellcheck --version
          files=$(find scripts -type f -name '*.sh' | sort)
          if [ -z "$files" ]; then
            echo "Aucun script *.sh à analyser."
            exit 0
          fi
          echo "Scripts analysés :"
          printf '  %s\n' $files
          code=0
          for fichier in $files; do
            shellcheck --severity=warning "$fichier" || code=1
          done
          exit $code

  # ───────────────────────────────────────────────────────────────────────────
  # Le cache pip est celui de `setup-python`, sur la même clé de fichier que celui qu'utilisait la
  # CI GitLab (pyproject.toml).
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install "ruff>=0.6,<1.0"
      - run: ruff check .

  # ───────────────────────────────────────────────────────────────────────────
  # Les quatre lignes d'installation sont DUPLIQUÉES avec le job `mypy` : le `extends:` de GitLab
  # n'a pas d'équivalent ici, et les deux réponses possibles — une
  # composite action maison, ou une matrice qui ferait tenir les deux commandes dans un seul job —
  # coûtent plus en lisibilité qu'elles ne rapportent sur quatre lignes. Une matrice ferait en
  # outre disparaître les noms `pytest` et `mypy` de la liste des checks — ce sont eux qu'une PR
  # affiche, et eux que `scripts/github/protect-main.sh` nomme le jour où la protection est posée
  # (docs/10 §8.8) : les renommer, les fusionner ou en supprimer un se répercute là-bas.
  #
  # `-n auto` (pytest-xdist) est conservé tel quel. C'est le job le plus sensible au runner : un
  # runner GitHub hébergé offre 2 vCPU sur un dépôt privé, là où la machine qui porte le runner de
  # l'équipe en a davantage — mesuré par #331, et assumé (docs/27 §2.4).
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -n auto --cov=maestro --cov-fail-under=90 --cov-report=term | tee pytest.log
      # La clé `coverage:` de GitLab (regex qui remontait le taux dans le badge et l'affichage MR)
      # n'a pas d'équivalent natif. Le GARDE-FOU, lui, n'en dépendait pas : `--cov-fail-under=90`
      # fait déjà échouer le job. Seul l'affichage était à reloger — ici, dans le résumé du run.
      - name: Couverture dans le résumé
        if: always()
        shell: bash
        run: |
          if [ -f pytest.log ]; then
            {
              echo '### Couverture'
              echo '```'
              grep -E '^TOTAL' pytest.log || echo '(ligne TOTAL absente)'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # Typage strict de maestro/ (config dans pyproject.toml).
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: mypy maestro

  # ───────────────────────────────────────────────────────────────────────────
  # lint → typage → tests → build, dans UN job : `npm ci` pèse bien plus que les contrôles
  # eux-mêmes, et le refaire deux fois de plus n'apprendrait rien. Ordre du plus rapide au plus
  # lent, verdict tôt quand il est rouge.
  #
  # La version de Node vient de `.node-version` (22.23.1), c'est-à-dire de la même source unique
  # que `setup.sh` et le serveur MCP côté poste — là où la CI GitLab recopiait un `node:22-alpine`
  # flottant. Le dépôt épingle sa version ; s'aligner dessus est plus fidèle à son invariant.
  web-build:
    needs: perimetre
    if: needs.perimetre.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Le typage avant les tests et le build : quelques secondes, et l'erreur en clair plutôt
      # qu'un `next build` rouge en fin de course (#236).
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
